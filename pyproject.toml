[project]
name = "musicmining"
description = "Python package for audio and music analyses"
license = "ISC"
license-files = ["LICENSE.md"]
readme = "README.md"
dependencies = [
    "essentia==2.1b6.dev1389",
    "librosa==1.0.0",
    "numpy==2.5.3",
    "opensmile==2.6.0",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "sqlalchemy==2.0.52",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]
source-separation = [
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:audioread.*",  # Cannot control the deprecations
]

[tool.setuptools.dynamic]
version = { attr = "musicmining.__version__" }

[tool.setuptools.packages.find]
include= ["musicmining*"]

[tool.ruff]
line-length=119
exclude = [
    "tests",
    "test_venv",
    "scratch"
]

[tool.ruff.lint]
select = ["E", "F", "S", "D", "W", "I", "PYI", "Q", "B", "SIM", "RUF", "TC", "NPY"]
ignore = [
    "D203",  # Don't need blank line before docstring
    "D204",  # Don't need blank line after docstring either
    "D211",  # Blank line before class
    "D212",  # Multi-line docstring summary first line start
    "D400",  # Relax on the first line punctuation
    "D413",  # Blank line at end of docstring is unecessary
    "D415",  # Relax on the first line punctuation
    "SIM108",  # Forced ternary operators are not the answer
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",  # No extended summary
    "EX01",  # Don't enforce 'Examples section
    "SA01",  # Don't enforce 'See Also' section
    "SS03",  # Relax on the first line punctuation
    "PR09",  # Descriptions should finish with a period, but not totally important
    "RT05",  # Relax on punctuation on return descriptions
    "SS02"   # Don't need capital letters enforced in module summaries
]

exclude_files = ["tests/.*"]
