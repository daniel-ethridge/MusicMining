name: CI

on:
  pull_request_review:
    types:
    - submitted
    branches:
    - main

  # Only for testing
  push:
    branches:
    - develop
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@main

      - name: Set up Python and Read Version
        id: python-setup
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'

      - name: Check if tag already exists
        run: |
          TARGET_TAG="${{ steps.python-setup.outputs.python-version }}"

          # Check if the tag exists either locally or on the remote origin
          if git rev-parse "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TARGET_TAG' already exists in the repository! Failing workflow to prevent duplicates."
            exit 1
          fi

      - name: Bump Version and Push Tag
        uses: laputansoft/github-tag-action@v4.6
        with:
          github_token: ${{ env.github-token }}
          tag: ${{ steps.python-setup.outputs.python-version }}
          create_annotated_tag: true
